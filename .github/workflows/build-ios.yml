name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Build (Release, unsigned)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p dist/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/App.app dist/Payload/
          cd dist
          zip -qry Nextrainers-unsigned.ipa Payload
          shasum -a 256 Nextrainers-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nextrainers-unsigned-ipa
          path: dist/Nextrainers-unsigned.ipa
          if-no-files-found: error
